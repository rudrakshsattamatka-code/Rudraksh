        });

        // Load Markets
        function loadMarkets() {
            marketsGrid.innerHTML = '';
            
            markets.forEach(market => {
                const marketCard = document.createElement('div');
                marketCard.className = 'classic-market-card';
                marketCard.onclick = () => openMarketResults(market);
                
                marketCard.innerHTML = `
                    <div class="classic-market-name">${market.name}</div>
                    <div class="classic-market-time">${market.time}</div>
                    <div class="view-results-classic">
                        <i class="fas fa-chart-line"></i> VIEW RESULTS
                    </div>
                `;
                
                marketsGrid.appendChild(marketCard);
            });
        }

        // Update Date and Time
        function updateDateTime() {
            const now = new Date();
            
            // Format time
            const timeOptions = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            };
            const timeString = now.toLocaleTimeString('en-US', timeOptions);
            
            // Format date
            const dateOptions = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            const dateString = now.toLocaleDateString('en-US', dateOptions);
            
            currentTimeElement.textContent = timeString;
            currentDateElement.textContent = dateString;
        }

        // Open Market Results
        function openMarketResults(market) {
            modalMarketName.textContent = `${market.name} - ${market.time}`;
            
            // Get results for this market
            const results = marketResults[market.name] || {
                otc: "000",
                open: "000",
                jodi: "00",
                panel: "000"
            };
            
            // Update the result values in the modal
            resultOTC.textContent = results.otc;
            resultOpen.textContent = results.open;
            resultJodi.textContent = results.jodi;
            resultPanel.textContent = results.panel;
            
            // Show the modal
            marketModal.style.display = 'flex';
        }

        // Close Modal
        function closeModal() {
            marketModal.style.display = 'none';
        }

        // Go Back
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        // Logout User
        function logoutUser() {
            if (confirm('Are you sure you want to logout?')) {
                auth.signOut().then(() => {
                    window.location.href = 'index.html';
                });
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target == marketModal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
