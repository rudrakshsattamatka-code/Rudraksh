    <style>
        /* Basic Reset & Body Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 3px solid #ff9800;
        }
        /* Header Styles */
        .header {
            background: linear-gradient(to right, #ff9800, #ff5722);
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .header h2 {
            font-size: 1.2rem;
            color: #ffeb3b;
            font-weight: 600;
        }
        .header i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
        }
        /* Tabs */
        .tabs {
            display: flex;
            background: #222;
            margin: 25px 20px 20px 20px;
            border-radius: 12px;
            overflow: hidden;
        }
        .tab {
            flex: 1;
            padding: 20px;
            border: none;
            background: transparent;
            color: #aaa;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: #ff9800;
            color: white;
        }
        /* Form Container */
        .form-container {
            padding: 0 25px 25px 25px;
        }
        .form {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .form.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <!-- FIREBASE SCRIPT TAGS (MUST BE IN THIS ORDER) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        // 1. FIREBASE CONFIGURATION (USE YOUR ACTUAL CONFIG)
        const firebaseConfig = {
            apiKey: "AIzaSyDVxg4EZHm4D2zMrz_ndLzcqx3wkhdPdVc",
            authDomain: "rudraksh-d74c3.firebaseapp.com",
            projectId: "rudraksh-d74c3",
            storageBucket: "rudraksh-d74c3.firebasestorage.app",
            messagingSenderId: "270620722307",
            appId: "1:270620722307:web:5a6454b69e12c201f6c7b6"
        };

        // 2. INITIALIZE FIREBASE
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // 3. SHOW MESSAGE FUNCTION
        function showMessage(message, type = 'success') {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = type === 'error' ? 'message-error' : 'message-success';
            messageBox.style.display = 'block';
            setTimeout(() => { messageBox.style.display = 'none'; }, 4000);
        }

        // 4. TAB SWITCHING
        document.getElementById('loginTab').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('registerForm').classList.remove('active');
        });

        document.getElementById('registerTab').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('registerForm').classList.add('active');
            document.getElementById('loginForm').classList.remove('active');
        });

        // 5. LOGIN FORM SUBMISSION
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const mobile = document.getElementById('loginMobile').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!/^[0-9]{10}$/.test(mobile)) {
                showMessage('Please enter a 10-digit mobile number.', 'error');
                return;
            }

            const email = mobile + '@rudrakshmatka.com';
            showMessage('Logging in...');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                showMessage('Login successful! Welcome back.');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
            } catch (error) {
                showMessage('Login failed: ' + error.message, 'error');
            }
        });

        // 6. REGISTRATION FORM SUBMISSION (SAVES NAME)
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            // Validation
            if (name.length < 3) {
                showMessage('Name must be at least 3 letters.', 'error');
                return;
            }
            if (!/^[0-9]{10}$/.test(mobile)) {
                showMessage('Please enter a 10-digit mobile number.', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }
            if (!document.getElementById('agreeTerms').checked) {
                showMessage('Please agree to the Terms & Conditions.', 'error');
                return;
            }

            const email = mobile + '@rudrakshmatka.com';
            showMessage('Creating your account...');

            try {
                // 1. CREATE USER
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 2. SAVE NAME TO PROFILE
                await user.updateProfile({
                    displayName: name
                });

                showMessage(`Welcome ${name}! Account created successfully.`);
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 3000);

            } catch (error) {
                let errorMsg = 'Registration failed. ';
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = 'This mobile number is already registered.';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = 'Password is too weak.';
                }
                showMessage(errorMsg, 'error');
            }
        });

        // 7. CHECK IF USER IS ALREADY LOGGED IN
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        console.log('Rudraksh App Loaded');
    </script>
